name: Documentation
description: Something is missing, wrong or unclear in the documentation.
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Affected page or file
      placeholder: "docs/quickstart.md"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
