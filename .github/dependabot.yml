version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies]
    # init and analyze must share one CodeQL Action version; split PRs fail CI.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
