# Local hooks are convenience, not enforcement: CI runs the same checks.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff-format
      - id: ruff
        args: ["--fix"]
  - repo: local
    hooks:
      - id: language-check
        name: repository language check (English only)
        entry: python scripts/validate_repository_language.py
        language: system
        pass_filenames: false
      - id: publication-audit
        name: publication audit (secrets / real data)
        entry: python scripts/audit_publication.py
        language: system
        pass_filenames: false
