[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "allwr-toolkit"
version = "0.1.0.dev0"
description = "Open-source migration, integration and automation tools for ALL WR - CLI, API and MCP."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Wealthreader S.L." }]
keywords = [
  "allwr",
  "migration",
  "asana",
  "freshdesk",
  "mcp",
  "data-migration",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business",
  "Topic :: System :: Archiving :: Mirroring",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# Pinned below 2.0: the 2.x SDK renamed FastMCP and changed core APIs
# (see ADR-0005); migrating is tracked for a later release.
mcp = ["mcp>=1.2,<2"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "respx>=0.22",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7.9",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
  "build>=1.2",
  "twine>=5.1",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/wealthreader/allwr-toolkit"
Documentation = "https://github.com/wealthreader/allwr-toolkit/tree/main/docs"
Issues = "https://github.com/wealthreader/allwr-toolkit/issues"
Changelog = "https://github.com/wealthreader/allwr-toolkit/blob/main/CHANGELOG.md"

[project.scripts]
allwr-toolkit = "allwr_toolkit.cli.main:main"

[project.entry-points."allwr_toolkit.connectors"]
asana = "allwr_toolkit.connectors.asana.connector:AsanaConnector"
freshdesk = "allwr_toolkit.connectors.freshdesk.connector:FreshdeskConnector"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
allwr_toolkit = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # isort
  "B",                # bugbear
  "UP",               # pyupgrade
  "S",                # bandit (subset)
  "N",                # pep8-naming
  "RUF",
]
ignore = [
  "S101",  # assert is fine in this codebase (tests and invariants)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B017"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["allwr_toolkit"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The MCP SDK's tool() decorator is partially typed in 1.x.
module = ["allwr_toolkit.mcp.server"]
disable_error_code = ["misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=allwr_toolkit --cov-report=term-missing --cov-fail-under=85"
filterwarnings = ["error::DeprecationWarning:allwr_toolkit.*"]

[tool.coverage.run]
branch = true
source = ["allwr_toolkit"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abc.abstractmethod",
  "@abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B101: asserts encode internal invariants; production behavior never relies
# on them (validated inputs raise typed errors instead).
skips = ["B101"]
